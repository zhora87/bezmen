name: Release

# A tag v<major>.<minor>.<patch> builds unsigned release APKs of both flavors for every ABI,
# attaches them with checksums to a draft GitHub Release and stops. Signing happens on the
# maintainer's machine with tools/release/sign.sh (docs/release.md), never in CI.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    name: Build unsigned release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: build/models
          key: models-${{ hashFiles('models.lock') }}

      - name: Version from the tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Build release APKs, verify no INTERNET permission
        run: >
          ./gradlew --no-daemon --stacktrace
          -Pbezmen.versionName=${{ steps.version.outputs.name }}
          -Pbezmen.versionCode=${{ steps.version.outputs.code }}
          assembleRelease verifyNoInternetFossRelease verifyNoInternetPlayRelease

      - name: Collect APKs and checksums
        run: |
          mkdir -p dist
          for f in androidApp/build/outputs/apk/*/release/*.apk; do
            flavor=$(basename "$(dirname "$(dirname "$f")")")
            abi=$(basename "$f" | sed -E 's/.*-(arm64-v8a|armeabi-v7a|x86_64)-.*/\1/')
            cp "$f" "dist/bezmen-${{ steps.version.outputs.name }}-$flavor-$abi-unsigned.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS-unsigned.txt && cat SHA256SUMS-unsigned.txt)

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.name }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || echo "No changelog section for this version." > dist/notes.md

      - name: Draft GitHub Release with unsigned APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS-unsigned.txt \
            --draft --title "Bezmen ${{ steps.version.outputs.name }}" --notes-file dist/notes.md
