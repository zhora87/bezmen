name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/renovate.json"
      - "tools/corpus/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/renovate.json"
      - "tools/corpus/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: build/models
          key: models-${{ hashFiles('models.lock') }}

      - name: Build both flavors, run tests, lint, verify no INTERNET permission
        run: ./gradlew build --no-daemon --stacktrace

      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-daemon

      - name: Parser accuracy on the synthetic corpus
        run: ./gradlew :tools:parser-cli:run --no-daemon --args="corpus --engine synthetic --verbose --min-accuracy 1.0"

      - name: Parser accuracy on the shipped engine's OCR dumps, ATB (end-to-end target)
        run: ./gradlew :tools:parser-cli:run --no-daemon --args="corpus --engine paddle-onnx --only uk-atb- --verbose --min-accuracy 0.85"

      - name: Parser accuracy on the shipped engine's OCR dumps, Tavria V (regression floor, layout not tuned yet)
        run: ./gradlew :tools:parser-cli:run --no-daemon --args="corpus --engine paddle-onnx --only uk-tavriav- --min-accuracy 0.50"

      - name: Parser accuracy on RapidOCR dumps (second opinion, regression floor)
        run: ./gradlew :tools:parser-cli:run --no-daemon --args="corpus --engine rapidocr --min-accuracy 0.60"

      - name: Coverage of core/domain (80% lines)
        run: ./gradlew :core:domain:koverVerify --no-daemon

      - name: Upload debug APKs (main only)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: androidApp/build/outputs/apk/**/debug/*.apk
          retention-days: 7

      - name: Upload detekt report (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/
          retention-days: 7
