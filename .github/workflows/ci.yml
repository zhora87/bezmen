name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/renovate.json"
      - "tools/corpus/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/renovate.json"
      - "tools/corpus/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: build/models
          key: models-${{ hashFiles('models.lock') }}

      - name: Build both flavors, run tests, lint, verify no INTERNET permission
        run: ./gradlew build --no-daemon --stacktrace

      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-daemon

      - name: Parser accuracy on the synthetic corpus
        run: ./gradlew :tools:parser-cli:run --no-daemon --args="corpus --engine synthetic --verbose --min-accuracy 1.0"

      - name: Parser accuracy on real OCR dumps (regression floor, raised as the corpus grows)
        run: ./gradlew :tools:parser-cli:run --no-daemon --args="corpus --engine rapidocr --verbose --min-accuracy 0.65"

      - name: Upload debug APKs (main only)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: androidApp/build/outputs/apk/**/debug/*.apk
          retention-days: 7

      - name: Upload detekt report (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/
          retention-days: 7
